var ina228SpeedChanging = false;
var ina228Speeds = [
	{index: 0, sps: 20000, time_us: 50},
	{index: 1, sps: 11905, time_us: 84},
	{index: 2, sps: 6666, time_us: 150},
	{index: 3, sps: 3571, time_us: 280},
	{index: 4, sps: 1851, time_us: 540},
	{index: 5, sps: 950, time_us: 1052},
	{index: 6, sps: 482, time_us: 2074},
	{index: 7, sps: 242, time_us: 4120}
];

async function SetINA228Speed(value) {
	if(ina228SpeedChanging)
		return;
	var speed = ina228Speeds[Number(value)];
	if(speed == null)
		return;

	var select = $("ina228Speed");
	var running = pp.dev.open && pp.dev.adc_wrk && pp.cfg != null && pp.cfg.name == "INA228";
	ina228SpeedChanging = true;
	select.disabled = true;
	try {
		if(running)
			await pp.Stop();

		config_ina228.time_us = speed.time_us;
		config_ina228.init[3][2] = 0xB000 |
			(speed.index << 3) | (speed.index << 6) | (speed.index << 9);
		config_ina228.t_us = config_ina228.time_us << (config_ina228.multiplier + 1);
		config_ina228.sps = (2000000.0/config_ina228.chnls)/config_ina228.t_us;

		if(running) {
			cur_idx = -1;
			await pp.SendConfig(config_ina228);
			infoline("INA228: " + speed.sps + " SPS selected");
		} else {
			infoline("INA228 speed: " + speed.sps + " SPS (will apply on Open)");
		}
	} finally {
		select.disabled = false;
		ina228SpeedChanging = false;
	}
}

$("ina228Speed").addEventListener('change', function() {
	SetINA228Speed(this.value);
});

function GetGraphDataU() {
	return graphDataU;
}

function GetGraphDataI() {
	return graphDataI;
}

function DecimateRawData(source, maxPoints) {
	if(source.length <= maxPoints)
		return source;
	var result = new Array();
	var bucketCount = Math.max(1, Math.floor(maxPoints / 2));
	var step = (source.length - 1) / bucketCount;
	for(var bucket = 0; bucket < bucketCount; bucket++) {
		var first = Math.floor(bucket * step);
		var last = Math.min(source.length, Math.floor((bucket + 1) * step));
		if(last <= first)
			last = first + 1;
		var minIndex = first;
		var maxIndex = first;
		for(var index = first + 1; index < last; index++) {
			if(source[index][1][1] < source[minIndex][1][1])
				minIndex = index;
			if(source[index][1][1] > source[maxIndex][1][1])
				maxIndex = index;
		}
		if(minIndex <= maxIndex) {
			result.push(source[minIndex]);
			if(maxIndex != minIndex)
				result.push(source[maxIndex]);
		} else {
			result.push(source[maxIndex]);
			result.push(source[minIndex]);
		}
	}
	return result;
}

function PrepareGraphData() {
	if(rawMode) {
		graphDataU = DecimateRawData(rawDataU, RAW_DRAW_POINTS_MAX);
		graphDataI = DecimateRawData(rawDataI, RAW_DRAW_POINTS_MAX);
	} else {
		graphDataU = datau;
		graphDataI = datai;
	}
}

function TrimRawData() {
	var limit = Math.max(1000, Math.ceil((pp.cfg.sps || 1) * RAW_WINDOW_SEC));
	if(rawDataI.length > limit + 1000) {
		var remove = rawDataI.length - limit;
		rawDataU.splice(0, remove);
		rawDataI.splice(0, remove);
	}
}

function SetRawMode(value) {
	rawMode = value;
	userTimeWindow = false;
	followRightEdge = false;
	if(gui != null)
		RendChart();
}

$("rawDataMode").addEventListener('change', function() {
	SetRawMode(this.checked);
});

}

function ClearData() {
	cur_idx = -1;
	adc_cnt = 0;
	dio_last = 0;
	dio_sample_count = 0;
	userTimeWindow = false;
	followRightEdge = false;
	datau = new Array();
	datai = new Array();
	rawDataU = new Array();
	rawDataI = new Array();
	dataDio = new Array();
	raw_sample_count = 0;
	datau.push([0, [0,0,0]]);
	datau.push([1, [0,195.3125,195.3125]]);
	datau.push([2, [0,28333.333,28333.333]]);
	datau.push([3, [0,56666.666,56666.666]]);
	datau.push([4, [0,85000,85000]]);
	datai.push([0, [-16.384,-16.384,0]]);
	datai.push([1, [-0.00003125,-0.00003125,0]]);
	datai.push([2, [0,0,0]]);
	datai.push([3, [0,0.00003125,0.00003125]]);
	datai.push([4, [0,16.384,16.384]]);
	dataDio.push(DioGraphRow(0, 0));
	UpdateDioDisplay(0);
	UpdateIntervalGRF(false);
}

function DioGraphRow(t, mask) {
	var row = [t];
	for(var bit = 0; bit < 8; bit++)
		row.push((mask & (1 << bit)) ? bit + 0.85 : bit + 0.15);
	return row;
}

function UpdateDioDisplay(mask) {
	$("dioMask").innerHTML = "mask: 0x" + hex(mask, 2);
	var html = "";
	for(var bit = 0; bit < 8; bit++) {
		var on = (mask & (1 << bit)) != 0;
		html += '<span style="display:inline-block; min-width:68px; color:' +
			(on ? 'Lime' : 'Gray') + ';">DIO' + bit + '=' + (on ? '1' : '0') + '</span>';
	}
	$("dioStatus").innerHTML = html;
}

function TrimDioData(minTime) {
	if(dataDio.length == 0)
		return;
	var remove = 0;
	while(remove + 1 < dataDio.length && dataDio[remove + 1][0] < minTime)
		remove++;
	if(remove > 0)
		dataDio.splice(0, remove);
	if(dataDio.length > 0 && dataDio[0][0] < minTime)
		dataDio[0][0] = minTime;
}

function IsAtRightEdge(right, left) {
	var graphI = rawMode ? rawDataI : datai;
	if(graphI.length < 2)
		return false;
	var end = graphI[graphI.length - 1][0];
	var span = (left !== undefined) ? right - left : 0;
	var tolerance = Math.max(span * 0.02, 0.01);
	return right >= end - tolerance;
}

function OnUserZoom(min, max) {
	userTimeWindow = true;
	followRightEdge = IsAtRightEdge(max, min);
}

function UpdateIntervalGRF(on = true) {
	if(rend_timer != null)
		clearInterval(rend_timer);
	if(on == true && gui != null && pp.dev.adc_wrk == true && cur_idx > 1) {
		let tt = 1000/RENDER_FPS; // ms
		if(pp.cfg.sps != null) {
			tt = 1000*RENDER_FPS/pp.cfg.sps;
			if(tt < 1000/RENDER_FPS)
			 tt = 1000/RENDER_FPS;
		}
		rend_timer = setInterval(function(){RendChart()}, tt);
		butstop.value = 'Stop';
	} else {
		rend_timer = null;
		if(gui != null)
			RendChart();
		butstop.value = 'Start';
	}
}

var sumu, sumi;
var smaxu, smaxi;
var sminu, smini;
var adc_cnt;
function AddData2Grf(du, di, dio) {
	if(cur_idx < 0) {
		datau = new Array();
		datai = new Array();
		rawDataU = new Array();
		rawDataI = new Array();
		dataDio = new Array();
		dio_last = 0;
		dio_sample_count = 0;
		raw_sample_count = 0;
		userTimeWindow = false;
		followRightEdge = false;
		var rawU = du*pp.cfg.kBus+pp.cfg.zBus;
		var rawI = di*pp.cfg.kShunt+pp.cfg.zShunt;
		rawDataU.push([0, [rawU, rawU, rawU]]);
		rawDataI.push([0, [rawI, rawI, rawI]]);
		raw_sample_count = 1;
		if(dio !== undefined) {
			dio_last = dio;
			dio_sample_count = 1;
			dataDio.push(DioGraphRow(0, dio));
			UpdateDioDisplay(dio);
		} else {
			dataDio.push(DioGraphRow(0, 0));
		}
		cur_idx = 0;
		adc_cnt = 0;
		sumu = 0;
		smaxu = -0xffffffff;
		sminu = 0xffffffff;
		sumi = 0;
		smaxi = -0xffffffff;
		smini = 0xffffffff;
		return;
	}
	var rawTime = raw_sample_count / pp.cfg.sps;
	var rawU = du*pp.cfg.kBus+pp.cfg.zBus;
	var rawI = di*pp.cfg.kShunt+pp.cfg.zShunt;
	rawDataU.push([rawTime, [rawU, rawU, rawU]]);
	rawDataI.push([rawTime, [rawI, rawI, rawI]]);
	raw_sample_count++;
	TrimRawData();
	if(dio !== undefined) {
		var dioTime = dio_sample_count / pp.cfg.sps;
		if(dio != dio_last)
			dataDio.push(DioGraphRow(dioTime, dio));
		dio_last = dio;
		dio_sample_count++;
		UpdateDioDisplay(dio);
	}
	if(adc_cnt > pp.cfg.sps/10) {
		var sampleTime = (dio_sample_count > 0) ?
			(dio_sample_count - 1)/pp.cfg.sps : adc_cnt*cur_idx/pp.cfg.sps;
		datau.push([sampleTime, [sminu*pp.cfg.kBus+pp.cfg.zBus, sumu*pp.cfg.kBus/adc_cnt+pp.cfg.zBus, smaxu*pp.cfg.kBus+pp.cfg.zBus]]);
		datai.push([sampleTime, [smini*pp.cfg.kShunt+pp.cfg.zShunt, sumi*pp.cfg.kShunt/adc_cnt+pp.cfg.zShunt, smaxi*pp.cfg.kShunt+pp.cfg.zShunt]]);
		dataDio.push(DioGraphRow(sampleTime, dio_last));
		cur_idx++;
		if(cur_idx == 2) {
			UpdateIntervalGRF();
		} else 	if(cur_idx >= samples) {
			datau.shift();
			datai.shift();
			TrimDioData(datai[0][0]);
		}
		sumu = du;
		smaxu = du;
		sminu = du;
		sumi = di;
		smaxi = di;
		smini = di;
		adc_cnt = 1;
	} else {
		sumu += du;
		if(smaxu < du) smaxu = du;
		if(sminu > du) sminu = du;
		sumi += di;
		if(smaxi < di) smaxi = di;
		if(smini > di) smini = di;
		adc_cnt++;
	}
}

function formatU_mV(xu) {
	var s;
	var mx = Math.abs(xu);
	if(mx < 1.0)
		s = (xu*1000.0).toFixed(1)+" nV";
	else if(mx < 1000.0)
		s = xu.toFixed(3)+" mV";
	else
		s = (xu/1000.0).toFixed(6)+" V";
	return s;
}	
function formatI_mA(xi) {
	var s;
	var mx = Math.abs(xi);
	if(mx < 0.001)
		s = (xi*1000000.0).toFixed(1)+" nA";
	else if(mx < 1.0)
		s = (xi*1000.0).toFixed(3)+" uA";
	else
		s = xi.toFixed(6)+" mA";
	return s;
}
function formatW_uW(xw) {
	var s;
	var mx = Math.abs(xw)
	if(mx < 1.0)
		s = (xw*1000.0).toFixed(1)+" nW";
	else if(mx < 1000.0)
		s = xw.toFixed(3)+" uW";
	else if(mx < 1000000.0)
		s = (xw/1000.0).toFixed(6)+" mW";
	else
		s = (xw/1000000.0).toFixed(6)+" W";
	return s;
}
function formatR(xu, xi) {
	var s = ">100 MOhm";
	if (xi != 0)
	var xr = xu/xi;
	var mx = Math.abs(xr);
	if(mx < 1000.0)
		s = xr.toFixed(3)+" Ohm";
	else if(mx < 1000000.0)
		s = (xr/1000.0).toFixed(6)+" kOhm";
	else if(mx < 100000000.0)
		s = (xr/1000000.0).toFixed(3)+" MOhm";
	return s;
}

//      $('#chk-zoom, #chk-selection').change(update);

function InstallWheelZoom() {
	var graphs = [guu, gui, gdio];
	var containers = [$("div_g1"), $("div_g2"), $("div_g3")];
	containers.forEach(function(container, index) {
		container.addEventListener('wheel', function(event) {
			var graph = graphs[index];
			if(graph == null || event.deltaY == 0)
				return;
			event.preventDefault();

			var range = graph.xAxisRange();
			var span = range[1] - range[0];
			if(span <= 0)
				return;
			var rect = container.getBoundingClientRect();
			var cursorX = event.clientX - rect.left;
			var cursor = graph.toDataXCoord(cursorX);
			var zoom = event.deltaY < 0 ? 0.8 : 1.25;
			var newSpan = span * zoom;
			var left = cursor - (cursor - range[0]) * zoom;
			var right = cursor + (range[1] - cursor) * zoom;
			if(newSpan > 0) {
				userTimeWindow = true;
				followRightEdge = IsAtRightEdge(right, left);
				graphs.forEach(function(g) {
					g.updateOptions({'dateWindow': [left, right]});
				});
			}
		}, {passive: false});
		container.addEventListener('dblclick', function() {
			setTimeout(function() {
				userTimeWindow = false;
				followRightEdge = false;
				RendChart();
			}, 0);
		});
		container.addEventListener('mouseup', function() {
			if(userTimeWindow && graph != null) {
				var range = graph.xAxisRange();
				followRightEdge = IsAtRightEdge(range[1], range[0]);
			}
		});
	});
}
function avg(arr) {
	var arrLen = arr.length, result = 0;
	for (var i = 0; i < arrLen; i++) result += arr[i];
	return result / arrLen;
}
function RendChart(){
	PrepareGraphData();
	var graphU = GetGraphDataU();
	var graphI = GetGraphDataI();
	if(graphI.length < 2)
		return;
	if(!userTimeWindow) {
		var fullWindow = [graphI[0][0], graphI[graphI.length - 1][0]];
		if(fullWindow[1] > fullWindow[0])
			gui.updateOptions({'dateWindow': fullWindow});
	} else if(followRightEdge && gui.dateWindow_) {
		var latest = graphI[graphI.length - 1][0];
		var windowSize = gui.dateWindow_[1] - gui.dateWindow_[0];
		if(windowSize > 0)
			gui.updateOptions({'dateWindow': [latest - windowSize, latest]});
	}
	var x = gui.xAxisRange();
	if (gui.dateWindow_) {
		if(x[0] < graphI[0][0])
			gui.dateWindow_[0] = graphI[0][0];
		if(x[1] < graphI[1][0])
			gui.dateWindow_[1] = graphI[1][0];
	}
	$('wdsize').innerHTML=((x[1]-x[0])).toFixed(3);

	var len = datai.length - average;
	if(len < 0)	len = 0;
	// mA  data = guu.rawData_.slice(len);
	var data = datai.slice(len);
	var sum = data.map(function(e){return e[1][1]})
             .reduce(function(a,b){return a+b});
	var xi = sum/data.length;
	$("ts1").innerHTML = formatI_mA(xi);
	// mV
	data = datau.slice(len);
	sum = data.map(function(e){return e[1][1]})
             .reduce(function(a,b){return a+b});
	var xu = sum/data.length;
	$("ts2").innerHTML = formatU_mV(xu);
	// uW
	$("ts3").innerHTML = formatW_uW(xu*xi); // mA * mV -> uW
	// R
	$("ts4").innerHTML = formatR(xu, xi); // Ohm

	if(graphI.length != 0) gui.updateOptions({'file': graphI});
	if(gdio != null) gdio.updateOptions({'file': dataDio});
}

function convertArrayOfObjectsToCSV(value){
	var result, ctr, keysu, keysi, columnDelimiter, lineDelimiter, datau, datai;
	datau = value.datau || null;
	datai = value.datai || null;
	if (datau == null || !datau.length) {return null;}
	if (datai == null || !datai.length) {return null;}
	columnDelimiter = value.columnDelimiter || ';';
	lineDelimiter = value.lineDelimiter || '\n';
	result = '';
	keysu = Object.keys(datau[1]);
	keysi = Object.keys(datai[1]);
	result += keysu.join(columnDelimiter);
	result += keysi.join(columnDelimiter);
	result += lineDelimiter;
	datau.forEach(function(item, idx){
		ctr = 0;
		keysu.forEach(function(key){
			if (ctr > 0)
				result += columnDelimiter;
			result += item[key];
			ctr++;
		});
		keysi.forEach(function(k){
			result += columnDelimiter;
			result += datai[idx][k];
		});
		result += lineDelimiter;
	});
	return result;
}
$("butSave").onclick =  function() {
	var csv = convertArrayOfObjectsToCSV({datau: datau, datai: datai});
	if (!csv.match(/^data:text\/csv/i)) {csv = 'data:text/csv;charset=utf-8,' + csv;}
	var encodedUri = encodeURI(csv);
	var link = document.createElement('a');
	link.setAttribute('href', encodedUri);
	link.setAttribute('download',"data.csv");
	link.click();
}

	//$("div_v").style.width = (window.innerWidth-50) + "px";
	}
}
